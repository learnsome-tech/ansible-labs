# Ansible Configuration Management at Scale — lesson m04l01 — Variables And Precedence
# https://learnsome.tech/courses/ansible-course/watch?lesson=m04l01
# © LearnSome.tech
---
- name: Use a play variable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    greeting: Hello from a variable
  tasks:
    - name: Show the greeting
      ansible.builtin.debug:
        msg: "{{ greeting }}"
