---
- name: Check the control node
  hosts: all
  gather_facts: true
  tasks:
    - name: Report the Ansible version and the Python it runs on
      ansible.builtin.debug:
        msg: "core {{ ansible_version.full }} on {{ ansible_python_version }}"
