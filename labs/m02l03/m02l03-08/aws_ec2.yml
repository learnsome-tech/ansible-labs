# Ansible Configuration Management at Scale — lesson m02l03 — Dynamic Inventory
# https://learnsome.tech/courses/ansible-course/watch?lesson=m02l03
# © LearnSome.tech
---
# The file name must end in this suffix for the plugin to pick it up.
plugin: amazon.aws.aws_ec2
regions:
  - eu-west-2
filters:
  tag:Environment: production
keyed_groups:
  - key: tags.Role
    prefix: role
  - key: placement.availability_zone
    prefix: zone
