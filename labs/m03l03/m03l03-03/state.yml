# Ansible Configuration Management at Scale — lesson m03l03 — Modules And Idempotency
# https://learnsome.tech/courses/ansible-course/watch?lesson=m03l03
# © LearnSome.tech
---
- name: Demonstrate idempotency
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure a marker file exists
      ansible.builtin.copy:
        content: managed by ansible\n
        dest: marker.txt
        mode: '0644'
