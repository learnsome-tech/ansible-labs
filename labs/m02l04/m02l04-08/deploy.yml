---
- name: Install and start the web server
  hosts: webservers
  become: true
  tasks:
    - name: Install the package
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Start the service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Check the health endpoint as the application user
      become: true
      become_user: app
      ansible.builtin.command: bin/healthcheck
      changed_when: false
