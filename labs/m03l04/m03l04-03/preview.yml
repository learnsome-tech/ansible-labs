# Ansible Configuration Management at Scale — lesson m03l04 — Check Mode And Diff
# https://learnsome.tech/courses/ansible-course/watch?lesson=m03l04
# © LearnSome.tech
---
- name: Preview a text change
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write the preview file
      ansible.builtin.copy:
        content: new configuration\n
        dest: preview.conf
        mode: '0644'
